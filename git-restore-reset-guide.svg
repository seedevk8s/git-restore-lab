<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800">
  <rect width="900" height="800" fill="#1a1a2e"/>

  <text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Git Restore and Reset Guide</text>

  <rect x="50" y="80" width="200" height="110" rx="15" fill="#667eea"/>
  <text x="150" y="115" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Working Directory</text>
  <text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">작업 디렉토리</text>
  <text x="150" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0e0e0">수정된 파일들</text>

  <rect x="350" y="80" width="200" height="110" rx="15" fill="#e84393"/>
  <text x="450" y="115" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Staging Area</text>
  <text x="450" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">스테이징 영역</text>
  <text x="450" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0e0e0">git add 된 파일들</text>

  <rect x="650" y="80" width="200" height="110" rx="15" fill="#00b894"/>
  <text x="750" y="115" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Repository</text>
  <text x="750" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">저장소 (커밋 이력)</text>
  <text x="750" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0e0e0">git commit 된 기록</text>

  <rect x="30" y="220" width="840" height="90" rx="10" fill="#2d2d44" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="60" cy="265" r="20" fill="#e74c3c"/>
  <text x="60" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="95" y="255" font-family="monospace" font-size="15" font-weight="bold" fill="#e74c3c">git restore [파일명]</text>
  <text x="95" y="280" font-family="sans-serif" font-size="13" fill="#cccccc">작업 디렉토리의 변경사항을 되돌립니다</text>
  <rect x="620" y="248" width="100" height="35" rx="5" fill="#667eea"/>
  <text x="670" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">Working</text>
  <path d="M 735 265 A 15 15 0 1 1 735 250" stroke="#e74c3c" stroke-width="3" fill="none"/>
  <polygon points="735,250 728,258 742,258" fill="#e74c3c"/>
  <text x="770" y="270" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e74c3c">되돌림</text>

  <rect x="30" y="330" width="840" height="90" rx="10" fill="#2d2d44" stroke="#3498db" stroke-width="2"/>
  <circle cx="60" cy="375" r="20" fill="#3498db"/>
  <text x="60" y="382" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="95" y="365" font-family="monospace" font-size="15" font-weight="bold" fill="#3498db">git restore --staged [파일명]</text>
  <text x="95" y="390" font-family="sans-serif" font-size="13" fill="#cccccc">스테이징 영역에서 파일을 제거합니다 (git add 취소)</text>
  <rect x="580" y="358" width="280" height="35" rx="5" fill="#2d2d44" stroke="#3498db" stroke-width="1"/>
  <rect x="590" y="365" width="70" height="22" rx="3" fill="#667eea"/>
  <text x="625" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffffff">Working</text>
  <line x1="665" y1="376" x2="720" y2="376" stroke="#3498db" stroke-width="3"/>
  <polygon points="665,376 677,370 677,382" fill="#3498db"/>
  <rect x="725" y="365" width="70" height="22" rx="3" fill="#e84393"/>
  <text x="760" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffffff">Staging</text>
  <text x="720" y="400" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#3498db">Unstage</text>

  <rect x="30" y="440" width="840" height="90" rx="10" fill="#2d2d44" stroke="#27ae60" stroke-width="2"/>
  <circle cx="60" cy="485" r="20" fill="#27ae60"/>
  <text x="60" y="492" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="95" y="475" font-family="monospace" font-size="15" font-weight="bold" fill="#27ae60">git reset HEAD^</text>
  <text x="95" y="500" font-family="sans-serif" font-size="13" fill="#cccccc">최신 커밋을 취소합니다. 변경사항은 작업 디렉토리에 유지됨 (--mixed)</text>
  <rect x="580" y="458" width="280" height="35" rx="5" fill="#2d2d44" stroke="#27ae60" stroke-width="1"/>
  <rect x="590" y="465" width="70" height="22" rx="3" fill="#667eea"/>
  <text x="625" y="480" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffffff">Working</text>
  <line x1="665" y1="476" x2="720" y2="476" stroke="#27ae60" stroke-width="3"/>
  <polygon points="665,476 677,470 677,482" fill="#27ae60"/>
  <rect x="725" y="465" width="70" height="22" rx="3" fill="#00b894"/>
  <text x="760" y="480" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffffff">Repo</text>
  <text x="720" y="500" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#27ae60">HEAD^ = 직전</text>

  <rect x="30" y="550" width="840" height="100" rx="10" fill="#2d2d44" stroke="#e67e22" stroke-width="2"/>
  <circle cx="60" cy="600" r="20" fill="#e67e22"/>
  <text x="60" y="607" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="95" y="580" font-family="monospace" font-size="15" font-weight="bold" fill="#e67e22">git reset [커밋해시]</text>
  <text x="95" y="605" font-family="sans-serif" font-size="13" fill="#cccccc">특정 커밋으로 되돌립니다. 이후 변경사항은 작업 디렉토리에 유지</text>
  <circle cx="550" cy="630" r="12" fill="#555555" stroke="#e67e22" stroke-width="2"/>
  <text x="550" y="634" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">abc1</text>
  <line x1="564" y1="630" x2="586" y2="630" stroke="#666666" stroke-width="2"/>
  <circle cx="600" cy="630" r="12" fill="#555555" stroke="#e67e22" stroke-width="2"/>
  <text x="600" y="634" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">def2</text>
  <line x1="614" y1="630" x2="636" y2="630" stroke="#666666" stroke-width="2"/>
  <circle cx="650" cy="630" r="12" fill="#e67e22" stroke="#e67e22" stroke-width="2"/>
  <text x="650" y="634" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">ghi3</text>
  <text x="650" y="620" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e67e22">HERE</text>
  <line x1="664" y1="630" x2="686" y2="630" stroke="#666666" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="700" cy="630" r="12" fill="#333333" stroke="#666666" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="700" y="634" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">jkl4</text>
  <line x1="714" y1="630" x2="736" y2="630" stroke="#666666" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="750" cy="630" r="12" fill="#333333" stroke="#666666" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="750" y="634" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">mno5</text>
  <text x="725" y="620" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888888">삭제됨</text>

  <rect x="30" y="670" width="840" height="110" rx="10" fill="#2d2d44" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="60" cy="725" r="20" fill="#9b59b6"/>
  <text x="60" y="732" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="95" y="700" font-family="monospace" font-size="15" font-weight="bold" fill="#9b59b6">git revert [커밋해시]</text>
  <text x="95" y="725" font-family="sans-serif" font-size="13" fill="#cccccc">특정 커밋의 변경사항을 취소하는 새로운 커밋을 생성합니다</text>
  <text x="95" y="750" font-family="sans-serif" font-size="10" fill="#9b59b6">* reset과 달리 히스토리가 보존됨 (협업 시 권장)</text>
  <circle cx="550" cy="730" r="12" fill="#555555" stroke="#9b59b6" stroke-width="2"/>
  <text x="550" y="734" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">A</text>
  <line x1="564" y1="730" x2="586" y2="730" stroke="#666666" stroke-width="2"/>
  <circle cx="600" cy="730" r="12" fill="#c0392b" stroke="#9b59b6" stroke-width="2"/>
  <text x="600" y="734" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">B</text>
  <text x="600" y="755" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c0392b">취소대상</text>
  <line x1="614" y1="730" x2="636" y2="730" stroke="#666666" stroke-width="2"/>
  <circle cx="650" cy="730" r="12" fill="#555555" stroke="#9b59b6" stroke-width="2"/>
  <text x="650" y="734" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">C</text>
  <line x1="664" y1="730" x2="686" y2="730" stroke="#666666" stroke-width="2"/>
  <circle cx="700" cy="730" r="12" fill="#27ae60" stroke="#9b59b6" stroke-width="3"/>
  <text x="700" y="734" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">B'</text>
  <text x="700" y="755" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#27ae60">NEW!</text>
</svg>
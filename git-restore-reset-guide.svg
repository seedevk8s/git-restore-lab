<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <linearGradient id="workingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stagingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Git Restore &amp; Reset 명령어 가이드</text>

  <!-- Three main areas -->
  <!-- Working Directory -->
  <rect x="50" y="80" width="200" height="120" rx="15" fill="url(#workingGrad)" filter="url(#shadow)"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Working Directory</text>
  <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">작업 디렉토리</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">수정된 파일들</text>

  <!-- Staging Area -->
  <rect x="350" y="80" width="200" height="120" rx="15" fill="url(#stagingGrad)" filter="url(#shadow)"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Staging Area</text>
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">스테이징 영역</text>
  <text x="450" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">git add 된 파일들</text>

  <!-- Repository -->
  <rect x="650" y="80" width="200" height="120" rx="15" fill="url(#repoGrad)" filter="url(#shadow)"/>
  <text x="750" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Repository</text>
  <text x="750" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">저장소 (커밋 이력)</text>
  <text x="750" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">git commit 된 기록</text>

  <!-- Command 1: git restore -->
  <rect x="30" y="230" width="840" height="85" rx="10" fill="#2d2d44" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="60" cy="272" r="18" fill="#e74c3c"/>
  <text x="60" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">1</text>

  <text x="95" y="260" font-family="monospace" font-size="16" font-weight="bold" fill="#e74c3c">git restore &lt;파일명&gt;</text>
  <text x="95" y="285" font-family="Arial, sans-serif" font-size="13" fill="#cccccc">작업 디렉토리의 변경사항을 되돌립니다. (마지막 커밋 또는 스테이징 상태로)</text>

  <!-- Arrow for command 1 -->
  <path d="M 550 272 C 480 272, 420 272, 350 272" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <rect x="560" y="255" width="140" height="35" rx="5" fill="#e74c3c" opacity="0.2"/>
  <text x="630" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Staging → Working</text>

  <!-- Command 2: git restore --staged -->
  <rect x="30" y="330" width="840" height="85" rx="10" fill="#2d2d44" stroke="#3498db" stroke-width="2"/>
  <circle cx="60" cy="372" r="18" fill="#3498db"/>
  <text x="60" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">2</text>

  <text x="95" y="360" font-family="monospace" font-size="16" font-weight="bold" fill="#3498db">git restore --staged &lt;파일명&gt;</text>
  <text x="95" y="385" font-family="Arial, sans-serif" font-size="13" fill="#cccccc">스테이징 영역에서 파일을 제거합니다. (git add 취소)</text>

  <!-- Arrow for command 2 -->
  <path d="M 750 372 C 650 372, 600 372, 530 372" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="8,4"/>
  <rect x="755" y="355" width="110" height="35" rx="5" fill="#3498db" opacity="0.2"/>
  <text x="810" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3498db">Repo → Staging</text>

  <!-- Command 3: git reset HEAD^ -->
  <rect x="30" y="430" width="840" height="85" rx="10" fill="#2d2d44" stroke="#27ae60" stroke-width="2"/>
  <circle cx="60" cy="472" r="18" fill="#27ae60"/>
  <text x="60" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">3</text>

  <text x="95" y="460" font-family="monospace" font-size="16" font-weight="bold" fill="#27ae60">git reset HEAD^</text>
  <text x="95" y="485" font-family="Arial, sans-serif" font-size="13" fill="#cccccc">최신 커밋을 취소합니다. 변경사항은 작업 디렉토리에 유지 (--mixed 기본값)</text>

  <!-- Arrow for command 3 -->
  <path d="M 800 472 C 700 472, 400 472, 280 472" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="8,4"/>
  <rect x="500" y="450" width="180" height="45" rx="5" fill="#27ae60" opacity="0.15"/>
  <text x="590" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">HEAD^ = 직전 커밋</text>
  <text x="590" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Repo → Working</text>

  <!-- Command 4: git reset <hash> -->
  <rect x="30" y="530" width="840" height="85" rx="10" fill="#2d2d44" stroke="#e67e22" stroke-width="2"/>
  <circle cx="60" cy="572" r="18" fill="#e67e22"/>
  <text x="60" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">4</text>

  <text x="95" y="560" font-family="monospace" font-size="16" font-weight="bold" fill="#e67e22">git reset &lt;커밋해시&gt;</text>
  <text x="95" y="585" font-family="Arial, sans-serif" font-size="13" fill="#cccccc">특정 커밋으로 되돌립니다. 해당 커밋 이후의 변경사항은 작업 디렉토리에 유지</text>

  <!-- Commit history visualization -->
  <g transform="translate(550, 545)">
    <circle cx="0" cy="27" r="12" fill="#555" stroke="#e67e22" stroke-width="2"/>
    <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">abc1</text>
    <line x1="14" y1="27" x2="40" y2="27" stroke="#666" stroke-width="2"/>
    <circle cx="55" cy="27" r="12" fill="#555" stroke="#e67e22" stroke-width="2"/>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">def2</text>
    <line x1="69" y1="27" x2="95" y2="27" stroke="#666" stroke-width="2"/>
    <circle cx="110" cy="27" r="12" fill="#e67e22" stroke="#e67e22" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">ghi3</text>
    <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e67e22">← 여기로 이동</text>
    <line x1="124" y1="27" x2="150" y2="27" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="165" cy="27" r="12" fill="#333" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="165" y="32" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">jkl4</text>
  </g>

  <!-- Command 5: git revert -->
  <rect x="30" y="630" width="840" height="95" rx="10" fill="#2d2d44" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="60" cy="677" r="18" fill="#9b59b6"/>
  <text x="60" y="683" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">5</text>

  <text x="95" y="660" font-family="monospace" font-size="16" font-weight="bold" fill="#9b59b6">git revert &lt;커밋해시&gt;</text>
  <text x="95" y="685" font-family="Arial, sans-serif" font-size="13" fill="#cccccc">특정 커밋의 변경사항을 취소하는 새로운 커밋을 생성합니다.</text>
  <text x="95" y="708" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">⚡ reset과 달리 히스토리가 보존되어 안전! (협업 시 권장)</text>

  <!-- Revert visualization -->
  <g transform="translate(550, 645)">
    <circle cx="0" cy="32" r="12" fill="#555" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="37" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">A</text>
    <line x1="14" y1="32" x2="40" y2="32" stroke="#666" stroke-width="2"/>
    <circle cx="55" cy="32" r="12" fill="#c0392b" stroke="#9b59b6" stroke-width="2"/>
    <text x="55" y="37" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">B</text>
    <text x="55" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c0392b">취소 대상</text>
    <line x1="69" y1="32" x2="95" y2="32" stroke="#666" stroke-width="2"/>
    <circle cx="110" cy="32" r="12" fill="#555" stroke="#9b59b6" stroke-width="2"/>
    <text x="110" y="37" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">C</text>
    <line x1="124" y1="32" x2="150" y2="32" stroke="#666" stroke-width="2"/>
    <circle cx="165" cy="32" r="12" fill="#27ae60" stroke="#9b59b6" stroke-width="3"/>
    <text x="165" y="37" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">B'</text>
    <text x="165" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">새 커밋!</text>
  </g>
</svg>